name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build binaries and script bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            name="host-watcher_${VERSION}_${os}_${arch}"
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$name/host-watcher$ext" ./cmd/host-watcher
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name"); \
            else tar -C build -czf "dist/$name.tar.gz" "$name"; fi
          done
          # Python scripts and hooks: the same toolkit without any binary.
          bundle="host-watcher_${VERSION}_scripts"
          mkdir -p "build/$bundle"
          cp -r scripts hooks examples LICENSE README.md "build/$bundle/"
          find "build/$bundle" -name '__pycache__' -prune -exec rm -rf {} +
          (cd build && zip -qr "../dist/$bundle.zip" "$bundle")
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --draft
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
